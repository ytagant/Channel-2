name: Repair Drama Share (TEMPORARY - delete after use)
on:
  workflow_dispatch:
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: pip install google-api-python-client google-auth
      - name: Share folder and wait for new credential versions
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PYEOF'
          import json, os, time
          from google.oauth2 import service_account
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          folder = os.environ['DRIVE_FOLDER_ID']
          with open('/tmp/sa.json', 'w') as f:
              f.write(os.environ['SERVICE_ACCOUNT_JSON'])
          sa = service_account.Credentials.from_service_account_file(
              '/tmp/sa.json', scopes=['https://www.googleapis.com/auth/drive'])
          drive = build('drive', 'v3', credentials=sa)
          me = '7star1461@gmail.com'
          perms = drive.permissions().list(
              fileId=folder, fields='permissions(id,emailAddress,role)').execute().get('permissions', [])
          existing = [p for p in perms if p.get('emailAddress') == me]
          created_perm_id = None
          if existing:
              print('SHARE_STATUS: already_shared')
          else:
              p = drive.permissions().create(
                  fileId=folder, fields='id',
                  body={'type': 'user', 'role': 'writer', 'emailAddress': me}).execute()
              created_perm_id = p['id']
              print('SHARE_STATUS: shared_now')
          with open('/tmp/perm_id.txt', 'w') as f:
              f.write(created_perm_id or '')
          def meta(name):
              q = "name = '%s' and '%s' in parents and trashed = false" % (name, folder)
              r = drive.files().list(q=q, fields='files(id,modifiedTime,md5Checksum)').execute().get('files', [])
              return r[0] if r else None
          before = {}
          for n in ('token.json', 'client_secret.json'):
              m = meta(n)
              before[n] = m.get('md5Checksum') if m else None
          print('waiting for new versions of token.json and client_secret.json ...')
          deadline = time.time() + 20 * 60
          changed = {}
          while time.time() < deadline:
              time.sleep(30)
              cur = {}
              for n in ('token.json', 'client_secret.json'):
                  m = meta(n)
                  cur[n] = m.get('md5Checksum') if m else None
              changed = dict((n, cur[n]) for n in cur if cur[n] and cur[n] != before[n])
              if len(changed) == 2:
                  break
              print('still waiting... changed so far: %s' % sorted(changed.keys()))
          if len(changed) != 2:
              raise SystemExit('TIMEOUT waiting for new file versions: %s' % sorted(changed.keys()))
          print('BOTH_FILES_UPDATED')
          def download(name):
              fid = meta(name)['id']
              return drive.files().get_media(fileId=fid).execute().decode('utf-8')
          token_data = json.loads(download('token.json'))
          cs_data = json.loads(download('client_secret.json'))
          ci = cs_data.get('web') or cs_data.get('installed')
          creds = Credentials(token=token_data.get('token'),
                              refresh_token=token_data.get('refresh_token'),
                              token_uri=ci.get('token_uri', 'https://oauth2.googleapis.com/token'),
                              client_id=ci['client_id'],
                              client_secret=ci['client_secret'],
                              scopes=token_data.get('scopes'))
          creds.refresh(Request())
          print('DRIVE_TOKEN_REFRESH_OK')
          yt = build('youtube', 'v3', credentials=creds)
          ch = yt.channels().list(part='snippet', mine=True).execute()['items'][0]
          print('DRIVE_TOKEN_CHANNEL: %s' % ch['snippet']['title'])
          PYEOF
      - name: Remove temporary share
        if: always()
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PYEOF'
          import os
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          folder = os.environ['DRIVE_FOLDER_ID']
          with open('/tmp/sa.json', 'w') as f:
              f.write(os.environ['SERVICE_ACCOUNT_JSON'])
          sa = service_account.Credentials.from_service_account_file(
              '/tmp/sa.json', scopes=['https://www.googleapis.com/auth/drive'])
          drive = build('drive', 'v3', credentials=sa)
          try:
              with open('/tmp/perm_id.txt') as f:
                  pid = f.read().strip()
          except FileNotFoundError:
              pid = ''
          if pid:
              drive.permissions().delete(fileId=folder, permissionId=pid).execute()
              print('SHARE_REMOVED')
          else:
              print('SHARE_REMOVED: nothing_created_by_this_run')
          PYEOF
